[project]
name = "serial-sniper-tracker"
version = "0.1.0"
description = "Tracks the wallets that snipe every new launch on Robinhood Chain, the bots that round-trip them, and what happens to those launches. Built on CoinGecko API data; ships the onchain-signal-bot starter it was forked from."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "websockets>=12.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
article-kit = [
    "playwright>=1.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bot", "core", "sniper"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
