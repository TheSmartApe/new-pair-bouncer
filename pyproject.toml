[project]
name = "onchain-signal-bot"
version = "0.1.0"
description = "A 24/7 onchain signal bot on CoinGecko API: screens pools with your rules, checks the smart money behind them, paper trades, and writes a morning recap."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "websockets>=12.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
article-kit = [
    "playwright>=1.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bot", "core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
