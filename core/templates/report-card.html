<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body[data-theme="light"] {
    --bg: #f7f9f6;
    --fg: #12271a;
    --muted: #6b7a70;
    --card-bg: #ffffff;
    --card-shadow: rgba(0, 0, 0, 0.06);
    --divider: rgba(18, 39, 26, 0.08);
    --positive: #2f8a1f;
    --negative: #c0392b;
    background: var(--bg);
  }
  body[data-theme="dark"] {
    --fg: #f4f7f4;
    --muted: #b7c2ba;
    --card-bg: rgba(244, 247, 244, 0.06);
    --card-shadow: rgba(0, 0, 0, 0.4);
    --divider: rgba(244, 247, 244, 0.1);
    --positive: #8bc53f;
    --negative: #ff6b6b;
    background: radial-gradient(circle at 15% 20%, #16241c 0%, #0b0f0d 55%), #0b0f0d;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--fg);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 48px 64px;
  }
  h1 { font-size: 38px; font-weight: 700; line-height: 1.15; letter-spacing: -0.01em; }
  .subtitle { font-size: 18px; color: var(--muted); margin-top: 8px; font-weight: 500; }
  .hero {
    background: var(--card-bg);
    border: 1px solid var(--divider);
    border-radius: 18px;
    padding: 18px 22px 12px;
    box-shadow: 0 2px 14px var(--card-shadow);
  }
  .hero-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .hero-label { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; font-weight: 600; }
  .legend { display: flex; align-items: center; gap: 14px; font-size: 13px; color: var(--muted); }
  .legend span.text { margin-left: 6px; }
  .swatch { display: inline-block; width: 16px; height: 0; vertical-align: middle; }
  .swatch.strategy { border-top: 3px solid var(--positive); border-radius: 3px; }
  .swatch.benchmark { border-top: 2px dashed var(--muted); }
  .hero svg { display: block; width: 100%; height: 172px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
  .stat { background: var(--card-bg); border: 1px solid var(--divider); border-radius: 16px; padding: 20px 22px; box-shadow: 0 2px 10px var(--card-shadow); }
  .stat .label { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .stat .value { font-size: 28px; font-weight: 700; margin-top: 8px; color: var(--fg); }
  .stat .subvalue { font-size: 15px; font-weight: 600; margin-top: 3px; color: var(--muted); }
  .value.positive, .subvalue.positive { color: var(--positive); }
  .value.negative, .subvalue.negative { color: var(--negative); }
  .footer { display: flex; align-items: center; justify-content: space-between; }
  .credits { font-size: 15px; color: var(--muted); }
  .badge img { height: 30px; display: block; }
</style>
</head>
<body data-theme="{{theme}}">
  <div>
    <h1>{{title}}</h1>
    {{subtitle_html}}
  </div>
  <div class="hero">
    <div class="hero-head">
      <div class="hero-label">Equity curve</div>
      <div class="legend">
        <span><span class="swatch strategy"></span><span class="text">Strategy</span></span>
        {{benchmark_legend_html}}
      </div>
    </div>
    {{equity_svg}}
  </div>
  <div class="stats">
    <div class="stat">
      <div class="label">P&amp;L</div>
      <div class="value {{pnl_class}}">{{pnl_usd_display}}</div>
      <div class="subvalue {{pnl_class}}">{{pnl_pct_display}}</div>
    </div>
    <div class="stat"><div class="label">Win rate</div><div class="value">{{win_rate_display}}</div></div>
    <div class="stat"><div class="label">Trades</div><div class="value">{{trades}}</div></div>
    <div class="stat"><div class="label">Max drawdown</div><div class="value">{{max_drawdown_display}}</div></div>
  </div>
  <div class="footer">
    <div class="credits">Credits used: {{credits_used}}</div>
    <div class="badge"><img src="{{logo}}" alt="CoinGecko API"></div>
  </div>
</body>
</html>
