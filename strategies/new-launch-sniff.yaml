# New-launch sniff test: screens brand-new pools for basic safety before anything else.
# Demo-friendly: new_pools works on a free Demo key. GT Score / honeypot / holder checks
# need token_info, which is also Demo-available, so this whole strategy runs on Demo.
name: new-launch-sniff
description: >
  Screens new pools for age, liquidity, and on-chain safety (GT Score, honeypot,
  holder concentration, dev holding) before taking a small paper position.

source:
  type: new_pools     # new_pools | trending | megafilter
  chain: solana
  n: 20                # candidates pulled per scan

# Tuned against a live spot check of /onchain/networks/solana/new_pools: most candidates from that
# feed are literally seconds to minutes old, so "24h volume" and "liquidity" are necessarily tiny at
# that point -- the old thresholds here (liquidity $10k, 24h volume $5k, 20 txns) failed 15-20 of
# every 20 candidates on liquidity/volume alone and produced zero passes across three separate
# 3-minute test runs. These are loosened to match what a brand-new pool can realistically show in
# its first minutes while still screening out the completely dead launches (near-zero liquidity,
# 1 txn, no real trading yet). If this strategy goes back to 0/20 on a normal market day, check the
# per-candidate check reasons in data/scans/new-launch-sniff.jsonl before loosening further.
filters:
  max_age_hours: 6
  min_liquidity_usd: 2500
  min_volume_24h_usd: 300
  min_txns_24h: 5
  min_gt_score: 60
  no_honeypot: true
  max_top10_holder_pct: 70
  max_dev_holding_pct: 15

smart_money_gate:
  enabled: false

entry:
  budget_usd: 50

exits:
  take_profit_pct: 40
  stop_loss_pct: 15
  max_hold_minutes: 240
