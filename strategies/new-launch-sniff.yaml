# New-launch sniff test: screens brand-new pools for basic safety before anything else.
# Demo-friendly: new_pools works on a free Demo key. GT Score / honeypot / holder checks
# need token_info, which is also Demo-available, so this whole strategy runs on Demo.
name: new-launch-sniff
description: >
  Screens new pools for age, liquidity, and on-chain safety (GT Score, honeypot,
  holder concentration, dev holding) before taking a small paper position.

source:
  type: new_pools     # new_pools | trending | megafilter
  chain: solana        # or `networks: [solana, base]` to scan more than one chain per scan
  n: 20                # candidates pulled per scan

# Root-caused against live data/scans/new-launch-sniff.jsonl, not just re-guessed thresholds: on a
# normal market day roughly half of `new_pools` candidates are a few seconds to minutes old, and for
# those, `reserve_in_usd` (liquidity) and GT Score routinely aren't indexed yet -- token_info can even
# 404 outright for a pool that young. Before this fix, `check_min` treated that "unknown" the same as
# "failed", so liquidity/gt_score alone silently zeroed out every candidate regardless of how the
# volume/txns/honeypot/holder thresholds below were tuned (0/20 across every recorded scan). The real
# fix is `allow_unknown` below: for THIS strategy specifically (a "sniff the newest pools" strategy,
# not a safety-first one) liquidity and GT Score log "unknown, allowing" instead of an auto-fail, and
# the strategy leans on volume/txns/honeypot/holder-concentration -- fields that are populated even on
# minute-old pools -- to actually screen out dead or unsafe launches. If this strategy goes back to
# 0/N on a normal market day, check the per-candidate reasons in data/scans/new-launch-sniff.jsonl
# before loosening further.
filters:
  max_age_hours: 6
  min_liquidity_usd: 2500
  min_volume_24h_usd: 100
  min_txns_24h: 3
  min_gt_score: 55
  no_honeypot: true
  max_top10_holder_pct: 75
  max_dev_holding_pct: 20
  allow_unknown: [liquidity, gt_score]

smart_money_gate:
  enabled: false

entry:
  budget_usd: 50

exits:
  take_profit_pct: 40
  stop_loss_pct: 15
  max_hold_minutes: 240
