# Base momentum: the same trending-momentum idea as the Solana strategy, but on Base -- proof that
# a strategy is just a `source.chain` away from any GeckoTerminal network CoinGecko supports. The
# chain id is validated against a live GET /onchain/networks at startup (see bot/networks.py); an
# unknown id fails fast with a clear error instead of silently returning zero candidates.
# Demo-friendly: trending_pools works on a free Demo key on every chain, Base included.
name: base-momentum
description: >
  Screens Base's trending pools for real volume and short-term upward momentum, with a light
  safety check via token_info. Same rules as trending-momentum, ported to a different chain.

source:
  type: trending
  chain: base           # validated at startup against GET /onchain/networks -- typo it and the bot
                        # tells you plainly instead of just scanning zero candidates forever
  duration: 1h          # 5m | 1h | 6h | 24h
  n: 20

filters:
  min_liquidity_usd: 15000
  min_volume_24h_usd: 30000
  min_txns_24h: 40
  min_price_change_pct_1h: 4
  no_honeypot: true
  max_top10_holder_pct: 80

smart_money_gate:
  enabled: false

entry:
  budget_usd: 75

exits:
  take_profit_pct: 25
  stop_loss_pct: 12
  max_hold_minutes: 180
