# Serial Sniper Tracker settings. Every key is optional; defaults live in sniper/config.py.
# Collection keys change what gets recorded. Analysis keys (snipe_s, min_launches, pack_*) can be
# changed any time and re-applied to the same recorded data with `python -m sniper report`.
chains: [robinhood]
interval_s: 120
window_s: 120
snipe_s: 10
min_launches: 3
handle: the_smart_ape
